# Docs: https://docs.playerpicked.com/clickableblocks/messages
prefix: "&#FFB74D[ClickableBlocks] "

# Hover text and click action of the chat prefix. {version} = plugin version
prefix-hover:
  enabled: true
  lines:
    - "&#FFB74DClickableBlocks &#8B95A5v{version}"
    - "&#CDD5E0Click to open the block list."
  click-command: "/cb"

# Values inserted into other messages and menus.
placeholders:
  none: "-"
  "yes": "&#6BD88BYes"
  "no": "&#F06464No"
  enabled: "&#6BD88BEnabled"
  disabled: "&#F06464Disabled"
  auto: "Auto"
  default: "Default"
  unlimited: "Unlimited"
  free: "Free"
  ready: "Ready"

triggers:
  LEFT: "Left click"
  RIGHT: "Right click"
  SHIFT_LEFT: "Shift + left click"
  SHIFT_RIGHT: "Shift + right click"
  ANY: "Any click"

types:
  BLOCK: "Block"
  ITEM_DISPLAY: "Item display"
  BLOCK_DISPLAY: "Block display"

# Setting names used in the "{setting} set to {value}" message and the delete question.
settings:
  enabled: "Status"
  particle: "Particle"
  permission: "Permission"
  cooldown: "Cooldown"
  cost: "Cost"
  max-uses: "Uses per player"
  cancel-interaction: "Block interaction cancel"
  glow: "Glow"
  glow-color: "Glow color"
  scale: "Scale"
  rotation: "Rotation"
  offset: "Offset"
  billboard: "Billboard"
  transform: "Item transform"
  spin: "Spin"
  spin-speed: "Spin speed"
  bob: "Bobbing"
  bob-height: "Bobbing height"
  hitbox: "Hitbox"
  transform-reset: "Transform"
  hologram: "Hologram"
  hologram-lines: "Hologram lines"
  hologram-background: "Hologram background"
  hologram-shadow: "Hologram shadow"
  hologram-billboard: "Hologram billboard"
  hologram-view-range: "Hologram view range"
  delete: "Delete {id}?"

messages:
  time:
    short:
      day: "d"
      hour: "h"
      minute: "m"
      second: "s"

  reload: "%prefix%&#6BD88BConfiguration reloaded."
  no-permission: "%prefix%&#F06464You don't have permission to do this."
  player-required: "%prefix%&#F06464Only players can use this command."
  player-not-found: "%prefix%&#F06464Player {player} not found."
  missing-argument: "%prefix%&#F06464Missing argument: {argument}"

  help:
    - ""
    - "&#FFB74DClickableBlocks &#8B95A5- commands"
    - "&#FFB74D/cb &#8B95A5- &#CDD5E0Open the block list"
    - "&#FFB74D/cb wand &#8B95A5- &#CDD5E0Get the editor wand"
    - "&#FFB74D/cb create <id> [type] &#8B95A5- &#CDD5E0Create a clickable where you look"
    - "&#FFB74D/cb edit [id] &#8B95A5- &#CDD5E0Edit a block, or the one you look at"
    - "&#FFB74D/cb info [id] &#8B95A5- &#CDD5E0Show the details of a block"
    - "&#FFB74D/cb tp <id> &#8B95A5- &#CDD5E0Teleport to a block"
    - "&#FFB74D/cb movehere <id> &#8B95A5- &#CDD5E0Move a block to where you look"
    - "&#FFB74D/cb toggle <id> &#8B95A5- &#CDD5E0Enable or disable a block"
    - "&#FFB74D/cb resetuses <id> &#8B95A5- &#CDD5E0Reset the uses and cooldowns of a block"
    - "&#FFB74D/cb run <id> <player> [trigger] &#8B95A5- &#CDD5E0Run the actions for a player"
    - "&#FFB74D/cb delete <id> &#8B95A5- &#CDD5E0Delete a block"
    - "&#FFB74D/cb reload &#8B95A5- &#CDD5E0Reload every config file"
    - ""

  block:
    not-found: "%prefix%&#F06464No clickable block named {id}."
    invalid-id: "%prefix%&#F06464The id may only contain 1-48 letters, numbers, - and _."
    already-exists: "%prefix%&#F06464A clickable block named {id} already exists."
    position-taken: "%prefix%&#F06464That block is already the clickable {id}."
    no-target: "%prefix%&#F06464Look at a block first."
    created: "%prefix%&#6BD88BClickable block {id} created."
    cloned: "%prefix%&#6BD88BCopied every setting of {source} to {id}."
    deleted: "%prefix%&#6BD88BClickable block {id} deleted."
    moved: "%prefix%&#6BD88BMoved {id} to {location}."
    teleported: "%prefix%&#6BD88BTeleported to {id}."
    world-not-loaded: "%prefix%&#F06464The world {world} is not loaded."
    enabled: "%prefix%&#6BD88BClickable block {id} enabled."
    disabled: "%prefix%&#F5C04DClickable block {id} disabled, it is hidden until you enable it again."
    type-changed: "%prefix%&#6BD88BThe type of {id} is now {type}."
    item-set: "%prefix%&#6BD88BDisplayed item set to {item}."
    not-a-block: "%prefix%&#F06464That item is not a placeable block."
    material-set: "%prefix%&#6BD88BBlock changed to {item}."
    tested: "%prefix%&#6BD88BTest run of {id} finished &#8B95A5({trigger})"
    no-actions: "%prefix%&#F5C04DThere are no actions for {trigger}."
    uses-reset: "%prefix%&#6BD88BUses and cooldowns of {id} were reset."
    force-run: "%prefix%&#6BD88BRan the actions of {id} for {player}."
    info:
      - ""
      - "&#FFB74D{id}"
      - "&#CDD5E0Type: &#FFB74D{type}"
      - "&#CDD5E0Location: &#FFB74D{location}"
      - "&#CDD5E0Status: {state}"
      - "&#CDD5E0Actions: &#FFB74D{actions}"
      - "&#CDD5E0Permission: &#FFB74D{permission}"
      - "&#CDD5E0Cooldown: &#FFB74D{cooldown}"
      - "&#CDD5E0Cost: &#FFB74D{cost}"
      - "&#CDD5E0Uses per player: &#FFB74D{max_uses}"
      - ""
    wand-received: "%prefix%&#6BD88BYou received the clickable wand."
    wand-hint:
      - "%prefix%&#CDD5E0Right click any block with the wand to create a clickable."
      - "%prefix%&#CDD5E0Click an existing clickable with the wand to edit it."

  click:
    disabled: "%prefix%&#F06464This is disabled right now."
    no-permission: "%prefix%&#F06464You don't have permission to use this."
    cooldown: "%prefix%&#F06464You can use this again in {time}."
    max-uses: "%prefix%&#F06464You already used this {max} times."
    not-enough-money: "%prefix%&#F06464You don't have enough money, this costs {cost}."
    paid: "%prefix%&#CDD5E0You paid &#FFB74D{cost}&#CDD5E0."
    economy-unavailable: "%prefix%&#F06464The economy is not available right now."

  editor:
    updated: "%prefix%&#6BD88B{setting} set to {value}"
    action-added: "%prefix%&#6BD88BAction added to {trigger}: &#CDD5E0{action}"
    action-updated: "%prefix%&#6BD88BAction updated: &#CDD5E0{action}"
    action-removed: "%prefix%&#F5C04DAction removed: &#CDD5E0{action}"
    action-limit: "%prefix%&#F06464This click already has the maximum of {max} actions."
    action-help:
      - ""
      - "&#FFB74DActions &#8B95A5- write them as [type] value"
      - "&#8B95A5A line without [type] runs as a player command."
      - "&#8B95A5Placeholders: {player} {uuid} {block} {world} {x} {y} {z} and PlaceholderAPI"
      - "&#FFB74D[player] spawn &#8B95A5- &#CDD5E0The player runs a command"
      - "&#FFB74D[console] give {player} diamond 1 &#8B95A5- &#CDD5E0The console runs a command"
      - "&#FFB74D[message] Hello! &#8B95A5- &#CDD5E0Chat message, \\n starts a new line"
      - "&#FFB74D[broadcast] text &#8B95A5- &#CDD5E0Message to everyone"
      - "&#FFB74D[actionbar] text &#8B95A5- &#CDD5E0Action bar message"
      - "&#FFB74D[title] title;subtitle;fadeIn;stay;fadeOut &#8B95A5- &#CDD5E0Title, times in ticks"
      - "&#FFB74D[sound] minecraft:entity.experience_orb.pickup;volume;pitch &#8B95A5- &#CDD5E0Play a sound"
      - "&#FFB74D[particle] HAPPY_VILLAGER;amount &#8B95A5- &#CDD5E0Particles on the block"
      - "&#FFB74D[effect] speed;seconds;level &#8B95A5- &#CDD5E0Potion effect"
      - "&#FFB74D[teleport] world;x;y;z;yaw;pitch &#8B95A5- &#CDD5E0Teleport the player"
      - "&#FFB74D[server] lobby &#8B95A5- &#CDD5E0Send to a proxy server"
      - "&#FFB74D[money] 100 &#8B95A5- &#CDD5E0Give money, a negative amount takes it"
      - "&#FFB74D[close] &#8B95A5- &#CDD5E0Close the open inventory"
      - "&#FFB74D[delay] 20 &#8B95A5- &#CDD5E0Wait ticks before the next actions"
      - ""
    invalid-action: "%prefix%&#F06464Unknown action {input}, use one of: {types}"
    invalid-number: "%prefix%&#F06464{input} is not a valid value."
    invalid-color: "%prefix%&#F06464{input} is not a valid hex color, use something like #FFAA00."
    invalid-permission: "%prefix%&#F06464{input} is not a valid permission node."
    input-cancelled: "%prefix%&#8B95A5Input cancelled."
    block-removed: "%prefix%&#F06464The clickable block {id} was deleted in the meantime."

version: 1
